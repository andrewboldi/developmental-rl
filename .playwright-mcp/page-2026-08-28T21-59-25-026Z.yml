  - generic [ref=f5e186]:
    - generic [ref=f5e187]:
      - paragraph [ref=f5e188]: H4 · teachers — chapter four
      - heading "The One Time I Reached the Mountain" [level=2] [ref=f5e189]
      - paragraph [ref=f5e190]:
        - text: No pianist learns from scratch. Teachers hand down compressed trajectories —
        - emphasis [ref=f5e191]: practice this passage, this way
        - text: "— distilled from their teachers, and theirs. The knowledge crosses generations through a narrow channel: not brains, stories. We built the smallest version of that channel we could measure."
      - paragraph [ref=f5e192]: "A gridworld hides a big reward far to the right, guarded by candy — small terminal rewards near the start that end episodes early and teach agents to stop looking. Each agent lives 15,000 steps with plasticity that decays as it ages: learning rate and exploration halve every 5,000 steps. Old agents remember their three best episodes ever — but can no longer act on them. At death, those episodes become advice: at most 100 state-action pairs, seeded optimistically into a fresh, fully plastic student."
