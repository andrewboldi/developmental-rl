  - generic [ref=f5e295]:
    - generic [ref=f5e296]:
      - paragraph [ref=f5e297]: synthesis
      - heading "Five Curves, One Lesson" [level=2] [ref=f5e298]
      - paragraph [ref=f5e299]:
        - text: "Every mechanism that worked, worked the same way: it changed"
        - emphasis [ref=f5e300]: which experience the learner got
        - text: ", not how the learner updates. The map replayed experience. Drills repositioned it. Variation shuffled it. Teachers curated it across lifetimes. Small bodies discounted its price."
      - paragraph [ref=f5e301]: That is what "between imitation and evaluation" means operationally. Pure evaluation wastes lifetimes rediscovering what the last lifetime knew; pure imitation caps the student at the teacher. The productive middle is a narrow, curated channel of experience — a curriculum, an anecdote, a drill, a start state — feeding a learner that remains free to disagree.
