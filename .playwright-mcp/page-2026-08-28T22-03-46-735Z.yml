  - generic [ref=f7e266]:
    - generic [ref=f7e267]:
      - paragraph [ref=f7e268]: synthesis
      - heading "Five Curves, One Lesson" [level=2] [ref=f7e269]
      - paragraph [ref=f7e270]:
        - text: "Every mechanism that worked, worked the same way: it changed"
        - emphasis [ref=f7e271]: which experience the learner got
        - text: ", not how the learner updates. The map replayed experience. Drills repositioned it. Variation shuffled it. Teachers curated it across lifetimes. Small bodies discounted its price."
      - paragraph [ref=f7e272]: That is what "between imitation and evaluation" means operationally. Pure evaluation wastes lifetimes rediscovering what the last lifetime knew; pure imitation caps the student at the teacher. The productive middle is a narrow, curated channel of experience — a curriculum, an anecdote, a drill, a start state — feeding a learner that remains free to disagree.
