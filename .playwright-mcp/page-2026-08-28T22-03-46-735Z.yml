  - generic [ref=f7e204]:
    - generic [ref=f7e205]:
      - paragraph [ref=f7e206]: H5 · morphology — chapter five
      - heading "Small Bodies Fall Cheaply" [level=2] [ref=f7e207]
      - paragraph [ref=f7e208]: "Toddlers fall about seventeen times an hour and shrug it off — small bodies carry little energy into the ground. By the square-cube law they are also relatively strong: strength scales with s², weight with s³. Falling is how you learn to stand, and evolution priced falling at its cheapest exactly when you need thousands of them."
      - paragraph [ref=f7e209]:
        - text: "Our learner balances a torque-limited pendulum whose scale s sets everything honestly: length s, mass 15s³, strength 40s², and fall damage (s)⁴ — impact energy. Six conditions, 120,000 steps each, all evaluated on the"
        - emphasis [ref=f7e210]: adult
        - text: body. Some train adult-sized from day one. Some start at half size and grow — on a schedule, or adaptively, growing only when the current body stops falling.
