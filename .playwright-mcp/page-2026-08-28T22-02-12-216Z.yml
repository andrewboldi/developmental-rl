      - heading "Nobody Learns Soccer by Playing Soccer" [level=2] [ref=f6e90]
      - paragraph [ref=f6e91]: "Coaches don't start with full matches, and piano teachers don't start with the whole piece. They isolate: shoot from close, then dribble, then play. We asked whether the drill structure itself — with no shaping, no hints, no extra reward — is worth anything to a reinforcement learner."
      - paragraph [ref=f6e92]:
        - text: Three agents got identical budgets of 60,000 steps on an 11×7 pitch where only goals are ever rewarded. One played full games from kickoff the whole time. One spent 20% of its budget spawning near the goal with the ball (shooting drill), 20% spawning in its own half (dribbling drill), then played full games. The only thing the curriculum changes is
        - emphasis [ref=f6e93]: where episodes start
        - text: .
