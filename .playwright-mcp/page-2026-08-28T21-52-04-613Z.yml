      - paragraph [ref=e146]:
        - text: "In 1979, Shea and Morgan split learners into two groups: one drilled each movement pattern in a block, one practiced them shuffled. Blocked practice looked better"
        - emphasis [ref=e147]: during
        - text: training — and lost on retention and transfer. Motor-learning calls it the contextual-interference effect. We reproduced it in a learner small enough to explain.
      - paragraph [ref=e148]:
        - text: Three short piano passages share a library of six three-note motifs; each passage has one exception where its fingering breaks the pattern. A linear learner practices either
        - emphasis [ref=e149]: blocked
        - text: (all of passage A, then B, then C) or
        - emphasis [ref=e150]: interleaved
        - text: "(a random passage each episode). Same total practice. The interference lives exactly where the skill does: in the shared motif weights."
