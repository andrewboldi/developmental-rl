      - heading "Nobody Learns Soccer by Playing Soccer" [level=2] [ref=f2e90]
      - paragraph [ref=f2e91]: "Coaches don't start with full matches, and piano teachers don't start with the whole piece. They isolate: shoot from close, then dribble, then play. We asked whether the drill structure itself — with no shaping, no hints, no extra reward — is worth anything to a reinforcement learner."
