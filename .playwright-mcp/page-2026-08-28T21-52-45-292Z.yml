      - heading "The Blindfold Test" [level=2] [ref=f2e52]
      - paragraph [ref=f2e53]:
        - text: Close your eyes in your own home and you can still find the fridge. Close your eyes in a stranger's home and you are lost immediately. Your motor neurons didn't change between those two sentences — your
        - emphasis [ref=f2e54]: map
        - text: did.
      - paragraph [ref=f2e55]: "We raised an agent in a 13×11 apartment with 10% motor slip, letting it learn both a policy and a transition model of its home. Then we took its observations away entirely. Blindfolded, it navigates by dead reckoning: it imagines where each action should have taken it, tracks a belief over where it probably is, and asks its value table what to do from there. The test: same blindfold, familiar home versus stranger's home."
    - generic "A dark apartment diorama. A glowing agent walks with a spotlight; when blindfolded, a ghost shows where it believes it is. In the stranger's home the ghost drifts away from the true body." [ref=f2e57]
